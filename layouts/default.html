<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/static/css/reset.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/static/css/style.css' | relative_url }}">
    <link rel="icon" type="image/x-icon" href="{{ '/static/img/favicon.ico' | relative_url }}">
    <meta name="google-site-verification" content="P5N4SE2Teg_bVpPsa9iLNmazbph8TcvY8dcjnD2dAc8">
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="container">
        <nav id="tab_bar" class="tab-bar" aria-label="Page sections">
            <a href="#profile" class="tab-bar__item" aria-label="Profile">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                </svg>
            </a>
            <a href="#biography" class="tab-bar__item" aria-label="Biography">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"></circle>
                    <circle cx="12" cy="10" r="3"></circle>
                    <path d="M6.168 18.849a4 4 0 0 1 3.832 -2.849h4a4 4 0 0 1 3.834 2.855"></path>
                </svg>
            </a>
            <a href="#publications" class="tab-bar__item" aria-label="Publications">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 17v-12c0 -1.121 -.879 -2 -2 -2s-2 .879 -2 2v12l2 2l2 -2z"></path>
                    <path d="M16 7h4"></path>
                    <path d="M18 19h-13a2 2 0 1 1 0 -4h4a2 2 0 1 0 0 -4h-3"></path>
                </svg>
            </a>
            <a href="#projects" class="tab-bar__item" aria-label="Projects">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.5 4h2.5a3 3 0 0 1 3 3v10a3 3 0 0 1 -3 3h-10a3 3 0 0 1 -3 -3v-5"></path>
                    <path d="M6 5l-2 2l2 2"></path>
                    <path d="M10 9l2 -2l-2 -2"></path>
                </svg>
            </a>
            <div id="circle_indicator" class="tab-bar__circle_indicator" aria-hidden="true"></div>
        </nav>
        <main id="main-content" class="content">
            {{ content }}
        </main>
    </div>
    {% include footer.md %}
    <dialog id="modal" class="content__publist__modal" aria-labelledby="modal_title">
        <div class="content__publist__modal__content">
            <div class="content__publist__modal__content__header">
                <h2 id="modal_title">Cite</h2>
                <button id="modal_close" class="content__publist__modal__content__header__close" type="button" aria-label="Close citation dialog">&times;</button>
            </div>
            <pre id="modal_content" class="content__publist__modal__content__bib"></pre>
            <div class="content__publist__modal__content__footer">
                <button id="modal_copy" class="content__publist__modal__content__footer__copy" type="button">Copy</button>
                <button id="modal_download" class="content__publist__modal__content__footer__download" type="button">Download</button>
            </div>
        </div>
    </dialog>
    <script src="{{ '/static/js/app.js' | relative_url }}"></script>
</body>
</html>
